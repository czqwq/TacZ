// Add any additional repositories for your dependencies here.

repositories { handler ->
    exclusiveContent {
        forRepository {
            handler.maven {
                name = 'glease'
                url = 'https://maven.glease.net/repos/releases/'
            }
        }
        filter {
            includeGroup('net.glease')
        }
    }

    // LuaJ (Figura fork) 与 simplebedrockmodel 的源码来源。上游从 jitpack 取得。
    exclusiveContent {
        forRepository {
            handler.maven {
                name = 'jitpack'
                url = 'https://jitpack.io'
            }
        }
        filter {
            includeGroup('com.github.FiguraMC.luaj')
            includeGroup('com.github.mcmodderanchor')
        }
    }
}
